name: AI Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
            SWAGGER_PATH: ${{ vars.SWAGGER_PATH }}
            STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
            STAGING_API_URL: ${{ vars.STAGING_API_URL }}
            LLM_MODEL: gemini-2.5-flash,gemini-flash-latest,gemini-flash-lite-latest
            CI: true
            FORCE_REGENERATE: true
            LLM_CACHE_ENABLED: false
            LLM_CACHE_VERSION: v1

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install dependencies
          run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Install Node.js dependencies
          run: npm install

        - name: Install Playwright Browsers
          run: npx playwright install --with-deps

        - name: Run CI quality gate
          run: npm run quality:gate:ci

        - name: Upload Playwright artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-artifacts
            path: |
              playwright-report
              test-results
            if-no-files-found: warn
