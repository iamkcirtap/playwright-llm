name: AI Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
            SWAGGER_PATH: ${{ vars.SWAGGER_PATH }}
            STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
            STAGING_API_URL: ${{ vars.STAGING_API_URL }}

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install dependencies
          run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Install Node.js dependencies
          run: npm install

        - name: Install Playwright Browsers
          run: npx playwright install --with-deps

        - name: Generate tests using LLM
          run: python scripts/generate_tests.py

        - name: Run Playwright API tests
          run: npx playwright test --project=api-tests

        - name: Run Playwright E2E tests
          run: npx playwright test --project=chromium

        - name: Upload Playwright artifacts
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-artifacts
            path: |
              playwright-report
              test-results
            if-no-files-found: warn
